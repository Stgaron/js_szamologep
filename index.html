<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Csabai Áron</title>
    <script src="index.js" type="module"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header>
            <h1>Számológép</h1>
        </header>
        <article>
            <input type="text" id="kiiroresz" name="kiiroresz">
            <section class="gombok">
                <button id="7" class="szamok" type="button">7</button>
                <button id="8" class="szamok" type="button">8</button>
                <button id="9" class="szamok" type="button">9</button>
                <button id="osztas" class="muvelet" type="button">/</button>
                <button id="4" class="szamok" type="button">4</button>
                <button id="5" class="szamok" type="button">5</button>
                <button id="6" class="szamok" type="button">6</button>
                <button id="szorzas" class="muvelet" type="button">*</button>
                <button id="1" class="szamok" type="button">1</button>
                <button id="2" class="szamok" type="button">2</button>
                <button id="3" class="szamok" type="button">3</button>
                <button id="torles" class="muvelet" type="button">C</button>
                <button id="kivonas" class="muvelet" type="button">-</button>
                <button id="0" class="szamok" type="button">0</button>
                <button id="egyenlo" class="muvelet" type="button">=</button>
                <button id="osszeadas" class="muvelet" type="button">+</button>
                

            </section>
        </article>
    </main>
</body>
</html>
